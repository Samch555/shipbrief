# ShipBrief sources. See README "Adding or removing sources".
#
# Fields:
#   id       unique slug (used in health.json and fixtures)
#   name     display name shown to readers
#   type     rss | github_releases | hn | arxiv     (rss also handles Atom and RDF)
#   url      feed / API URL            (github_releases: derived from `repo` if omitted)
#   repo     owner/name                (github_releases only)
#   weight   0.1 .. 2.0 source importance used by ranking (default 1.0)
#   tags     default topic tags for items from this source
#   kind     default kind: news | release | paper | tool | discussion
#   roles    default audience
#   maxItems cap on items taken from this source per run (default 30)
#   minScore HN only: minimum points
#   enabled  set false to keep a source documented but skip it
#
# Every URL here was verified by scripts/verify_sources.py. Dropped sources are listed in DECISIONS.md.

defaults:
  weight: 1.0
  maxItems: 30
  roles: [everyone]

sources:
  # ---------------------------------------------------------------- AI labs & companies
  - {id: openai-news, name: OpenAI News, type: rss, url: "https://openai.com/news/rss.xml", weight: 1.8, tags: [models], kind: news, roles: [everyone, developer]}
  - {id: google-deepmind, name: Google DeepMind Blog, type: rss, url: "https://deepmind.google/blog/rss.xml", weight: 1.7, tags: [models, research], kind: news, roles: [everyone, researcher]}
