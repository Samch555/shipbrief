# Tests + offline dry run on every push / PR (no network, no secrets).
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "feed.xml"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m shipbrief dry-run --out out
      - run: python -m shipbrief validate out/data/latest.json docs/samples/sample-digest.json
